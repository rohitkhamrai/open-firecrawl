<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open-Firecrawl</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background: #0f172a; color: #f8fafc; padding: 2rem; max-width: 800px; margin: 0 auto; }
        input, textarea, button { width: 100%; box-sizing: border-box; padding: 1rem; margin-bottom: 1rem; background: #1e293b; color: #f8fafc; border: 1px solid #334155; border-radius: 8px; font-family: monospace; }
        button { background: #3b82f6; cursor: pointer; font-weight: bold; border: none; }
        button:hover { background: #2563eb; }
        button:disabled { background: #475569; cursor: not-allowed; }
        pre { background: #020617; padding: 1rem; border-radius: 8px; overflow-x: auto; font-family: monospace; }
        #loader { display: none; color: #38bdf8; font-weight: bold; margin-bottom: 1rem; }
        .input-group { margin-bottom: 1rem; }
    </style>
</head>
<body>
    <h1>🔥 open-firecrawl</h1>
    <p>OSINT Keyword Agent & Deep-crawl Domain Extractor.</p>
    
    <hr style="border: 1px solid #334155; margin: 2rem 0;">
    
    <h2>🕵️ OSINT Keyword Agent</h2>
    <form id="keywordForm">
        <div class="input-group">
            <label for="keyword">Pooja Keyword</label>
            <input type="text" id="keyword" name="keyword" placeholder="e.g. Maha Shivaratri Pooja" required>
        </div>
        <button type="submit" id="keywordBtn">Run Keyword Agent</button>
    </form>

    <hr style="border: 1px solid #334155; margin: 2rem 0;">

    <h2>🕸️ URL Deep Crawler</h2>
    
    <form id="scrapeForm">
        <div class="input-group">
            <label for="url">Target URL</label>
            <input type="url" id="url" name="url" placeholder="https://example.com" value="https://smartpuja.com/" required>
        </div>
        
        <div class="input-group">
            <label for="limit">Max Deep Pages (Limit)</label>
            <input type="number" id="limit" name="limit" placeholder="5" value="5" min="1" max="20" required>
        </div>

        <div class="input-group">
            <label for="schema">JSON Extraction Schema:</label>
            <textarea id="schema" name="schema" rows="15" required>
{
  "type": "object",
  "properties": {
    "poojas": {
      "type": "array",
      "items": {
        "type": "object",
        "properties": {
          "title": { "type": "string" },
          "price_inr": { "type": "number" },
          "description": { "type": "string" }
        }
      }
    },
    "blogs": {
      "type": "array",
      "items": {
        "type": "object",
        "properties": {
          "title": { "type": "string" },
          "content_summary": { "type": "string" }
        }
      }
    }
  }
}
            </textarea>
        </div>
        
        <button type="submit" id="btn">Start Deep Crawl</button>
    </form>
    
    <div id="loader">Spidering internal links and extracting schemas (this may take up to 60 seconds)...</div>
    
    <h2>Database Output:</h2>
    <pre id="result">{}</pre>

    <script>
        const loader = document.getElementById('loader');
        const resultBox = document.getElementById('result');

        document.getElementById('scrapeForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn');
            
            btn.disabled = true;
            loader.style.display = 'block';
            loader.textContent = 'Spidering internal links and extracting schemas (this may take up to 60 seconds)...';
            resultBox.textContent = '{}';
            
            const url = document.getElementById('url').value;
            const schema = document.getElementById('schema').value;
            const limit = document.getElementById('limit').value;

            let schemaObj;
            try {
                schemaObj = JSON.parse(schema);
            } catch (err) {
                resultBox.textContent = "Error: Invalid JSON Schema - " + err.message;
                btn.disabled = false;
                loader.style.display = 'none';
                return;
            }

            try {
                const res = await fetch('/scrape', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: url, schema: schemaObj, limit: parseInt(limit) })
                });
                const data = await res.json();
                resultBox.textContent = JSON.stringify(data, null, 2);
            } catch (err) {
                resultBox.textContent = "Error: " + err;
            } finally {
                btn.disabled = false;
                loader.style.display = 'none';
            }
        });

        document.getElementById('keywordForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const keyword = document.getElementById('keyword').value;
            const keywordBtn = document.getElementById('keywordBtn');
            
            keywordBtn.disabled = true;
            loader.style.display = 'block';
            loader.textContent = 'Agent running (this may take up to 60s)...';
            resultBox.textContent = '';
            
            try {
                const res = await fetch('/keyword', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ keyword: keyword })
                });
                const data = await res.json();
                resultBox.textContent = JSON.stringify(data, null, 2);
            } catch (err) {
                resultBox.textContent = "Error: " + err;
            } finally {
                keywordBtn.disabled = false;
                loader.style.display = 'none';
            }
        });
    </script>
</body>
</html>
